<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwilted — Legal</title>
<style>
  :root { --accent:#5B5BD6; --ink:#222; --muted:#6b6b76; --line:#ececf1; }
  body { margin:0; background:#fff; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width:460px; width:100%; padding:48px 28px; text-align:center; }
  .dot { width:18px; height:18px; border-radius:5px; background:var(--accent); display:inline-block; }
  h1 { font-size:26px; font-weight:650; letter-spacing:-.3px; margin:14px 0 6px; }
  p { color:var(--muted); margin:0 0 28px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  a.btn { display:block; padding:14px 18px; border:1px solid var(--line); border-radius:12px;
    text-decoration:none; color:var(--ink); font-weight:600; transition:.15s; }
  a.btn:hover { border-color:var(--accent); color:var(--accent); }
  .foot { margin-top:30px; font-size:13px; color:var(--muted); }
  .foot a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>Qwilted</h1>
    <p>Legal documents</p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy Policy</a>
      <a class="btn" href="terms.html">Terms of Use</a>
    </div>
    <p class="foot">Contact <a href="mailto:support@qwilted.app">support@qwilted.app</a></p>
  </div>
</body>
</html>
